<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="quillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568"/>
      <stop offset="50%" style="stop-color:#2D3748"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
    <linearGradient id="inkGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1A202C"/>
      <stop offset="100%" style="stop-color:#4A5568"/>
    </linearGradient>
  </defs>
  <!-- Background circle with subtle border -->
  <circle cx="50" cy="50" r="48" fill="#FDFBF7" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Quill pen - elegant feather shape -->
  <path d="M70 15 Q65 25 60 35 Q55 45 52 55 L50 75 L48 55 Q45 45 40 35 Q35 25 30 15 Q50 30 70 15"
        fill="url(#quillGradient)" opacity="0.9"/>
  <!-- Quill shaft -->
  <line x1="50" y1="55" x2="50" y2="85" stroke="url(#inkGradient)" stroke-width="2" stroke-linecap="round"/>
  <!-- Ink drop -->
  <ellipse cx="50" cy="88" rx="4" ry="3" fill="#2D3748"/>
  <!-- Decorative flourish lines representing verses -->
  <line x1="30" y1="92" x2="45" y2="92" stroke="#A0AEC0" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="92" x2="70" y2="92" stroke="#A0AEC0" stroke-width="1" stroke-linecap="round"/>
</svg>
