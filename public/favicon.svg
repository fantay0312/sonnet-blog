<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 竹青渐变 -->
    <linearGradient id="bamboo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FB89A"/>
      <stop offset="100%" style="stop-color:#5A7A63"/>
    </linearGradient>
    <!-- 金箔渐变 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C872"/>
      <stop offset="100%" style="stop-color:#C4A962"/>
    </linearGradient>
  </defs>

  <!-- 背景 - 圆润方形 -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bamboo)"/>

  <!-- 内圈装饰 -->
  <rect x="10" y="10" width="80" height="80" rx="18" fill="none" stroke="#FDFBF7" stroke-width="1.5" opacity="0.3"/>

  <!-- S 字母 - 优雅书法风格 -->
  <path
    d="M58 28
       Q68 28 68 38
       Q68 48 50 50
       Q32 52 32 62
       Q32 72 42 72"
    fill="none"
    stroke="#FDFBF7"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- 金箔点缀 - 如印章 -->
  <circle cx="72" cy="72" r="8" fill="url(#gold)"/>
</svg>
