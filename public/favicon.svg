<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 禅圆 ensō：一笔墨圈，留白处缀一枚金点 -->
  <style>
    .bg { fill: #FDFBF7; }
    .ink { stroke: #2F2F2D; }
    .gold { fill: #C4A962; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161614; }
      .ink { stroke: #E8E4DC; }
      .gold { fill: #D4B972; }
    }
  </style>

  <rect class="bg" x="2" y="2" width="96" height="96" rx="24"/>

  <!-- 自右上起笔，顺时针一周，收笔于左上，留出气口；
       三段递减的笔宽模拟毛笔由按到提的锥度 -->
  <g fill="none" stroke-linecap="round">
    <path class="ink" stroke-width="9.2" d="M 67 20.6 A 34 34 0 0 1 82.2 60.9"/>
    <path class="ink" stroke-width="8.3" d="M 82.2 60.9 A 34 34 0 0 1 45.6 83.7"/>
    <path class="ink" stroke-width="7.4" d="M 45.6 83.7 A 34 34 0 0 1 16.1 52.2"/>
    <path class="ink" stroke-width="6.5" d="M 16.1 52.2 A 34 34 0 0 1 41.2 17.2"/>
  </g>

  <!-- 金点：落于气口，如印 -->
  <circle class="gold" cx="54.4" cy="16.3" r="5"/>
</svg>
